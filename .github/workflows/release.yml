name: Release

# Publishes a downloadable WinUpgradeDiag.exe against a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run it by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write          # needed to create the release and attach the binary

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is generated from the commits since the previous tag, and the default
          # single-commit checkout has no history to read.
          fetch-depth: 0

      - name: Build (Release)
        run: dotnet build WinUpgradeDiag.sln -c Release --nologo

      - name: Test
        # A binary that ships without its tests having passed is not a release.
        run: dotnet test tests/WinUpgradeDiag.Tests/WinUpgradeDiag.Tests.csproj -c Release --nologo

      - name: Verify the binary is self-contained
        shell: pwsh
        run: |
          $exe = 'src/WinUpgradeDiag.App/bin/Release/net48/WinUpgradeDiag.exe'
          $resources = [Reflection.Assembly]::LoadFrom((Resolve-Path $exe)).GetManifestResourceNames()
          if ($resources -notcontains 'WinUpgradeDiag.App.Dependencies.WinUpgradeDiag.Core.dll') {
              throw 'The Core assembly is not embedded; this build would need a DLL beside it.'
          }

      - name: Stage the artifact and record its hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'src/WinUpgradeDiag.App/bin/Release/net48/WinUpgradeDiag.exe' dist/
          Copy-Item 'src/WinUpgradeDiag.Cli/bin/Release/net48/WinUpgradeDiag.Cli.exe' dist/

          # The hash is what the endpoint security team allow-lists, so it belongs beside the
          # download rather than in a separate email.
          $hash = (Get-FileHash dist/WinUpgradeDiag.exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item dist/WinUpgradeDiag.exe).Length / 1KB)
          $cliHash = (Get-FileHash dist/WinUpgradeDiag.Cli.exe -Algorithm SHA256).Hash

          # Both hashes in one file: the security team allow-lists whichever head is deployed.
          @(
            "$hash  WinUpgradeDiag.exe"
            "$cliHash  WinUpgradeDiag.Cli.exe"
          ) | Set-Content dist/SHA256SUMS.txt

          # A zip for a ConfigMgr package source folder. Content delivered by the client never
          # passes through a browser, so it never gets a Mark of the Web and SmartScreen has
          # nothing to check — which is the only route that works on a managed endpoint where
          # policy has removed the "Run anyway" button.
          Copy-Item docs/DEPLOYMENT.md dist/

          # The script head goes out on its own as well. Where application control blocks
          # unsigned executables outright, this is the only thing that runs at all — WDAC and
          # AppLocker enforce on .exe by publisher, path or hash, and script rules are commonly
          # audit-only or path-allowed.
          Copy-Item Script/Get-UpgradeFailure.ps1 dist/

          Compress-Archive -Path `
            dist/WinUpgradeDiag.Cli.exe, `
            dist/WinUpgradeDiag.exe, `
            dist/Get-UpgradeFailure.ps1, `
            dist/SHA256SUMS.txt, `
            dist/DEPLOYMENT.md `
            -DestinationPath dist/WinUpgradeDiag-ConfigMgr.zip
          Remove-Item dist/DEPLOYMENT.md

          "SHA256=$hash" | Out-File -Append $env:GITHUB_ENV
          "SIZE=$size"   | Out-File -Append $env:GITHUB_ENV
          Write-Host "SHA-256: $hash  ($size KB)"

      - name: Build the changelog from the commits since the last release
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }

          # The tag immediately before this one *in history*, not merely the next one down by
          # version order: re-publishing an older tag would otherwise compare against a newer one
          # and produce an empty changelog. Errors when there is no earlier tag, which is the
          # first release.
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $previous = $null }

          if ($previous) {
              $range = "$previous..$tag"
              Write-Host "Changelog range: $range"
          } else {
              $range = $tag
              Write-Host "No previous tag; using the whole history."
          }

          # Subject lines only. A commit body belongs in the commit, not in a release page.
          $subjects = git log --no-merges --format=%s $range
          if (-not $subjects) { $subjects = @() }

          $lines = @($subjects | ForEach-Object { "- $_" })
          if ($lines.Count -eq 0) { $lines = @("- No changes recorded.") }

          $changelog = ($lines -join "`n")
          if ($previous) {
              $repo = "${{ github.server_url }}/${{ github.repository }}"
              $changelog += "`n`n[Full diff]($repo/compare/$previous...$tag)"
          }

          Set-Content -Path dist/changelog.md -Value $changelog -Encoding utf8
          Write-Host $changelog

      - name: Write the release notes
        shell: pwsh
        run: |
          # Single-quoted here-string: PowerShell treats a backtick as an escape character, so a
          # double-quoted one would eat the markdown code fences. Placeholders are substituted
          # afterwards rather than interpolated.
          $notes = @'
          ## What changed

          __CHANGELOG__

          ## Downloads

          Two self-contained executables. Each carries the Core assembly and all 12 recovery
          scripts inside it, so nothing else needs to be copied alongside.

          | File | Use |
          | --- | --- |
          | `WinUpgradeDiag.exe` (__SIZE__ KB) | The window. Run it on the affected machine. |
          | `WinUpgradeDiag.Cli.exe` | Console head, for a ConfigMgr Run Script or a remote session. |
          | `WinUpgradeDiag-ConfigMgr.zip` | Both heads plus deployment notes, for a package source folder. |
          | `Get-UpgradeFailure.ps1` | Script head. The one that runs where application control blocks executables. |

          **On a managed endpoint, do not download this with a browser.** A browser download carries
          a Mark of the Web, SmartScreen checks the reputation of an unsigned binary built minutes
          ago, and where policy sets "Warn and prevent bypass" there is no Run anyway. Deploy the
          zip through ConfigMgr instead: the client leaves no Mark of the Web and runs the console
          head as SYSTEM, which is also what makes the protected Setup logs readable. See
          `DEPLOYMENT.md` inside the zip.

          **SHA-256** — both hashes are in `SHA256SUMS.txt` attached below. The GUI head is:

          ```
          __SHA256__
          ```

          ## Requirements on the target machine

          | | |
          | --- | --- |
          | .NET Framework | 4.8 — in-box on Windows 10 1903+ and Windows 11. Windows 10 1809 and earlier need it installed. |
          | Privileges | Runs unelevated; the protected Setup logs under `$WINDOWS.~BT` need administrator. |
          | Network | None. The tool makes no outbound connection of any kind. |

          ## Before deploying

          This binary is **not code-signed**. Sign it with your organisation's internal certificate
          and allow-list the resulting hash with your endpoint security team before any pilot.

          Distribute it through ConfigMgr or an internal share rather than having technicians
          download executables from GitHub onto managed endpoints — see `docs/SECURITY.md`.
          '@

          $changelog = Get-Content dist/changelog.md -Raw
          $notes = $notes.Replace('__SHA256__', $env:SHA256).Replace('__SIZE__', $env:SIZE)
          $notes = $notes.Replace('__CHANGELOG__', $changelog.TrimEnd())
          Set-Content -Path dist/notes.md -Value $notes -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }

          gh release create $tag `
            dist/WinUpgradeDiag.exe `
            dist/WinUpgradeDiag.Cli.exe `
            dist/WinUpgradeDiag-ConfigMgr.zip `
            dist/Get-UpgradeFailure.ps1 `
            dist/SHA256SUMS.txt `
            --title "WinUpgradeDiag $tag" `
            --notes-file dist/notes.md
